[project]
name = "baum-welch-parameter-estimation-tools"
version = "0.1.0"
description = "Trains a discrete hidden Markov model's parameters from observation data using EM in pure Python"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
